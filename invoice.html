<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LUXUS PAINT 請款申請</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:#f0f2f5;min-height:100vh}
.navbar{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.nlogo{width:40px;height:40px;background:linear-gradient(135deg,#e94560,#f5a623);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
.ntitle{font-size:18px;font-weight:700}.nsub{font-size:12px;opacity:.7}
.nadmin{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.nadmin:hover{background:rgba(255,255,255,.25)}
.container{max-width:920px;margin:0 auto;padding:24px 16px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:640px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border-radius:12px;padding:14px 16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.sv{font-size:20px;font-weight:800;color:#e94560}.sl{font-size:12px;color:#888;margin-top:3px}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 16px rgba(0,0,0,.08);margin-bottom:20px}
.card-title{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:4px;height:18px;background:linear-gradient(135deg,#e94560,#f5a623);border-radius:2px}
/* Scan */
.scan-wrap{border:2px dashed #d0d0d0;border-radius:12px;padding:20px;text-align:center;background:#fafafa;cursor:pointer;transition:.2s}
.scan-wrap:hover{border-color:#e94560;background:#fff5f7}
.btn-scan{background:linear-gradient(135deg,#e94560,#c73652);color:#fff;border:none;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}
.scan-active{text-align:center}
.scan-img-wrap{position:relative;display:inline-block}
#scanImg{max-width:100%;max-height:180px;border-radius:10px;object-fit:contain;border:2px solid #e0e0e0}
.progress-bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:10px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,#e94560,#f5a623);border-radius:3px;transition:width .3s;width:0%}
.scan-status-txt{font-size:12px;color:#888;margin-bottom:8px}
.scan-result-row{font-size:13px;padding:5px 0;border-bottom:1px solid #f0f0f0;text-align:left}
.btn-rescan{background:none;border:none;color:#aaa;font-size:13px;cursor:pointer;margin-top:6px}
/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.fg{display:flex;flex-direction:column;gap:5px}.fg.full{grid-column:1/-1}
label{font-size:13px;font-weight:600;color:#555}
.req{color:#e94560}
input[type=text],input[type=date],input[type=number],input[type=email],textarea{
  border:1.5px solid #e0e0e0;border-radius:10px;padding:10px 13px;font-size:14px;font-family:inherit;outline:none;width:100%;transition:border-color .2s}
input:focus,textarea:focus{border-color:#e94560;box-shadow:0 0 0 3px rgba(233,69,96,.1)}
textarea{resize:vertical;min-height:75px}
.upload-area{border:2px dashed #d0d0d0;border-radius:10px;padding:22px;text-align:center;cursor:pointer;transition:.2s;background:#fafafa}
.upload-area:hover,.upload-area.drag-over{border-color:#e94560;background:#fff5f7}
.uicon{font-size:32px;margin-bottom:6px}.utxt{color:#888;font-size:13px}.utxt strong{color:#e94560}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:8px;margin-top:10px}
.pi{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:#f0f0f0}
.pi img{width:100%;height:100%;object-fit:cover}
.pi-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pcnt{font-size:12px;color:#888;margin-top:5px}
.btn-submit{width:100%;padding:13px;background:linear-gradient(135deg,#e94560,#c73652);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;transition:.2s}
.btn-submit:hover{opacity:.9;transform:translateY(-1px)}.btn-submit:disabled{background:#ccc;cursor:not-allowed;transform:none}
/* Filter */
.filter-bar{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.ffg{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
.ffg label{font-size:12px;font-weight:600;color:#666}
.ffg input{border:1.5px solid #e0e0e0;border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
.btn-dl{padding:9px 16px;background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-cl{padding:9px 12px;background:#f5f5f5;color:#666;border:none;border-radius:8px;font-size:13px;cursor:pointer}
/* Records */
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.rcnt{background:#fff0f3;color:#e94560;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:700}
.ri{border:1.5px solid #f0f0f0;border-radius:12px;padding:14px;margin-bottom:10px;transition:.2s}
.ri:hover{border-color:#ddd;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ri-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.ri-no{font-size:12px;font-weight:700;color:#e94560;background:#fff0f3;padding:2px 8px;border-radius:5px}
.ri-amount{font-size:18px;font-weight:800;color:#1a1a2e;margin-top:4px}
.ri-amount small{font-size:12px;font-weight:400;color:#999}
.ri-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:#666}
.ri-meta span{background:#f5f5f5;padding:2px 8px;border-radius:5px}
.ri-purpose{font-size:13px;color:#444;margin-top:8px;padding-top:8px;border-top:1px solid #f5f5f5}
.ri-reject{font-size:12px;color:#842029;background:#f8d7da;border-radius:6px;padding:6px 10px;margin-top:8px}
.ri-photos{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.ri-photo{width:56px;height:56px;border-radius:7px;object-fit:cover;cursor:pointer;border:2px solid #f0f0f0}
.ri-photo:hover{border-color:#e94560}
/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.b-pending{background:#fff3cd;color:#856404}
.b-approved{background:#d1e7dd;color:#0a3622}
.b-rejected{background:#f8d7da;color:#842029}
.b-paid{background:#cfe2ff;color:#084298}
/* Lightbox */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9998;align-items:center;justify-content:center;flex-direction:column}
.lb.open{display:flex}
.lb img{max-width:92vw;max-height:85vh;border-radius:8px;object-fit:contain}
.lb-x{position:absolute;top:16px;right:20px;color:#fff;font-size:32px;cursor:pointer;background:none;border:none}
.lb-nav{display:flex;gap:14px;margin-top:12px}
.lb-nav button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 18px;border-radius:8px;cursor:pointer;font-size:13px}
.toast{position:fixed;top:20px;right:20px;background:#27ae60;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);transform:translateX(120%);transition:transform .3s;z-index:9999}
.toast.show{transform:translateX(0)}.toast.err{background:#e74c3c}
.empty{text-align:center;padding:36px;color:#bbb}.empty .ei{font-size:44px;margin-bottom:10px}
.live-dot{width:8px;height:8px;background:#27ae60;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite;margin-left:6px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
</style>
</head>
<body>

<div class="navbar">
  <div class="nlogo">LP</div>
  <div><div class="ntitle">LUXUS PAINT 請款系統</div><div class="nsub">員工請款申請平台</div></div>
  <a href="admin.html" class="nadmin">⚙️ 後台管理</a>
</div>

<div class="container">

  <div class="stats-row">
    <div class="stat"><div class="sv" id="sCount">—</div><div class="sl">📄 本月筆數</div></div>
    <div class="stat"><div class="sv" id="sAmount">—</div><div class="sl">💰 本月總金額</div></div>
    <div class="stat"><div class="sv" id="sPending">—</div><div class="sl">🕐 待審中</div></div>
    <div class="stat"><div class="sv" id="sApproved">—</div><div class="sl">✅ 本月通過</div></div>
  </div>

  <!-- 掃描 -->
  <div class="card">
    <div class="card-title" style="margin-bottom:14px">📷 掃描發票自動填入 <span style="font-size:12px;color:#888;font-weight:400;margin-left:4px">AI 辨識日期、金額、統編、發票號碼</span></div>
    <input type="file" id="scanInput" accept="image/*" style="display:none">

    <!-- 選擇模式 -->
    <div id="scanEmpty">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="scan-wrap" onclick="document.getElementById('scanInput').click()" style="padding:16px">
          <div style="font-size:32px">🖼️</div>
          <div style="color:#888;font-size:13px;margin:6px 0">選擇照片</div>
          <div style="font-size:11px;color:#bbb">從相簿或檔案選取</div>
        </div>
        <div class="scan-wrap" onclick="startCamera()" style="padding:16px">
          <div style="font-size:32px">📷</div>
          <div style="color:#888;font-size:13px;margin:6px 0" id="cameraLabel">即時鏡頭掃描</div>
          <div style="font-size:11px;color:#bbb" id="cameraDesc">開啟相機對準發票</div>
        </div>
      </div>
    </div>

    <!-- 相機預覽 -->
    <div id="cameraWrap" style="display:none;text-align:center">
      <div style="position:relative;display:inline-block;width:100%">
        <video id="cameraVideo" autoplay playsinline style="width:100%;max-height:300px;border-radius:12px;background:#000;object-fit:cover"></video>
        <div style="position:absolute;inset:0;border:3px solid #e94560;border-radius:12px;pointer-events:none;box-shadow:inset 0 0 0 2000px rgba(0,0,0,0.2)"></div>
        <!-- 對準框 -->
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;height:55%;border:2px dashed #fff;border-radius:8px;pointer-events:none"></div>
        <div style="position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,0.8);white-space:nowrap">將發票對準虛線框內</div>
      </div>
      <div style="display:flex;gap:10px;margin-top:12px;justify-content:center">
        <button type="button" onclick="captureCamera()" style="background:linear-gradient(135deg,#e94560,#c73652);color:#fff;border:none;padding:12px 28px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer">📸 拍攝辨識</button>
        <button type="button" onclick="stopCamera()" style="background:#f5f5f5;color:#555;border:none;padding:12px 18px;border-radius:12px;font-size:14px;cursor:pointer">✕ 關閉</button>
      </div>
      <canvas id="cameraCanvas" style="display:none"></canvas>
    </div>

    <!-- 辨識結果 -->
    <div id="scanActive" class="scan-active" style="display:none">
      <img id="scanImg" style="max-width:100%;max-height:160px;border-radius:10px;border:2px solid #e0e0e0;object-fit:contain">
      <div id="scanProgress" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="scanFill"></div></div>
        <div class="scan-status-txt" id="scanTxt">辨識中...</div>
      </div>
      <div id="scanResultBox" style="display:none;background:#f8f9fa;border-radius:8px;padding:12px;margin-top:8px;text-align:left"></div>
      <button type="button" class="btn-rescan" onclick="resetScan()">✕ 清除重掃</button>
    </div>
  </div>

  <!-- 表單 -->
  <div class="card">
    <div class="card-title">新增請款單</div>
    <form id="form">
      <div class="form-grid">
        <div class="fg"><label>申請日期 <span class="req">*</span></label><input type="date" id="applicationDate" required></div>
        <div class="fg"><label>發票日期 <span class="req">*</span></label><input type="date" id="date" required></div>
        <div class="fg"><label>金額（元）<span class="req">*</span></label><input type="number" id="amount" placeholder="請輸入金額" min="0" required></div>
        <div class="fg"><label>統一編號（統編）</label><input type="text" id="taxId" placeholder="8 碼數字，如有則填" maxlength="8"></div>
        <div class="fg"><label>發票號碼 <span class="req">*</span></label><input type="text" id="invoiceNo" placeholder="例：AB-12345678" required></div>
        <div class="fg"><label>申請人 <span class="req">*</span></label><input type="text" id="applicant" placeholder="姓名" required></div>
        <div class="fg full"><label>電子信箱 <span class="req">*</span></label><input type="email" id="email" placeholder="方便會計通知審查結果" required></div>
        <div class="fg full"><label>用途說明 <span class="req">*</span></label><textarea id="purpose" placeholder="請描述購買用途或費用說明..." required></textarea></div>
        <div class="fg full">
          <label>上傳發票照片 <span style="color:#888;font-weight:400">（最多 5 張）</span></label>
          <div class="upload-area" id="uploadArea">
            <div class="uicon">📷</div>
            <div class="utxt">點擊或拖曳照片<br><strong>可一次選取多張</strong></div>
            <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
          </div>
          <div class="preview-grid" id="previewGrid"></div>
          <div class="pcnt" id="pcnt"></div>
        </div>
      </div>
      <div class="progress-bar" id="submitBar" style="display:none"><div class="progress-fill" id="submitFill"></div></div>
      <button type="submit" class="btn-submit" id="submitBtn">📤 送出請款單</button>
    </form>
  </div>

  <!-- 篩選 -->
  <div class="filter-bar">
    <div class="ffg"><label>📅 開始日期</label><input type="date" id="fStart"></div>
    <div class="ffg"><label>📅 結束日期</label><input type="date" id="fEnd"></div>
    <div class="ffg"><label>👤 申請人</label><input type="text" id="fName" placeholder="全部"></div>
    <div class="ffg"><label>狀態</label>
      <select id="fStatus" style="border:1.5px solid #e0e0e0;border-radius:8px;padding:8px 10px;font-size:13px;outline:none">
        <option value="">全部</option>
        <option value="pending">審查中</option>
        <option value="approved">通過</option>
        <option value="rejected">退件</option>
        <option value="paid">已付款</option>
      </select>
    </div>
    <button class="btn-dl" id="btnDl">⬇️ 下載 Excel</button>
    <button class="btn-cl" id="btnCl">✕ 清除</button>
  </div>

  <!-- 紀錄 -->
  <div class="card">
    <div class="rh">
      <div class="card-title" style="margin-bottom:0">請款紀錄 <span class="live-dot"></span></div>
      <div class="rcnt" id="rcnt">載入中...</div>
    </div>
    <div id="recList"><div class="empty"><div class="ei">⏳</div>載入中...</div></div>
  </div>
</div>

<div class="lb" id="lb">
  <button class="lb-x" id="lbX">✕</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-nav"><button id="lbP">◀ 上一張</button><button id="lbN">下一張 ▶</button></div>
</div>
<div class="toast" id="toast"></div>

<!-- OCR (UMD Tesseract - 需在 module 前) -->
<script>
function parseROCDate(t){
  // 1. 嚴格 AD 格式緊靠時間戳（最可靠）：2025-12-12 08:49:22
  let m=t.match(/(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})\s+\d{2}:\d{2}/);
  if(m){
    const y=+m[1],mo=+m[2],d=+m[3];
    if(y>=2000&&y<=2100&&mo>=1&&mo<=12&&d>=1&&d<=31)
      return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  // 2. 時間戳反推：OCR 讀壞年份時（U25-17-12 → 提取所有數字群組）
  const tm=t.match(/(.{4,25}?)\s+(\d{2}:\d{2}:\d{2})/);
  if(tm){
    const nums=(tm[1].match(/\d+/g)||[]);
    if(nums.length>=3){
      let y=+nums[nums.length-3],mo=+nums[nums.length-2],d=+nums[nums.length-1];
      if(y<200)y+=2000;
      if(mo>12&&d<=12){[mo,d]=[d,mo];}  // 月日互換修正
      if(y>=2000&&y<=2100&&mo>=1&&mo<=12&&d>=1&&d<=31)
        return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
  }
  // 3. ROC 格式：114年01月15日 或 114/01/15
  m=t.match(/(\d{2,3})[\/年](\d{1,2})[\/月](\d{1,2})/);
  if(m){const y=parseInt(m[1])<200?parseInt(m[1])+1911:parseInt(m[1]);return `${y}-${String(parseInt(m[2])).padStart(2,'0')}-${String(parseInt(m[3])).padStart(2,'0')}`;}
  // 4. 一般 AD 格式
  m=t.match(/(\d{4})[\s\/\-\.\u2013\u2014\uff0d](\d{1,2})[\s\/\-\.\u2013\u2014\uff0d](\d{1,2})/);
  if(m){
    const y=+m[1],mo=+m[2],d=+m[3];
    if(y>=2000&&y<=2100&&mo>=1&&mo<=12&&d>=1&&d<=31)
      return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  return null;
}
function parseAmount(t){
  // ── 方法1：逐行掃描，台灣電子發票固定格式「隨機碼(4位) + 總計(3-6位)」同行 ──
  for(const line of t.split(/[\n\r]+/)){
    const nums=(line.match(/\d+/g)||[]).filter(n=>n.length>=3);
    if(nums.length>=2){
      const first=nums[0],last=nums[nums.length-1];
      // 第一個恰好 4 位（隨機碼），最後一個 3-6 位（總計）
      if(first.length===4&&last.length>=3&&last.length<=6&&first!==last){
        const v=parseInt(last);if(v>=10&&v<=999999)return v;
      }
    }
  }
  // ── 方法2：Regex patterns ──
  const ps=[
    /(?:合[\s]?計|總[\s]?計|总[\s]?計|总[\s]?计|小[\s]?計|小[\s]?计|含[\s]?稅|含[\s]?税|應[\s]?付|应[\s]?付)[:\s：]*(?:NT\$|NTD|\$|＄)?\s*(\d[\d,]+)/i,
    /[）)]\s*(\d{3,6})\b/,
    /(?:合計|總計|总計|总计|小計|小计|含稅|含税|應付|应付)[^0-9]{0,15}(\d[\d,]+)/,
    /NT\$\s*(\d[\d,]+)/i,
    /NTD\s*(\d[\d,]+)/i,
    /＄\s*(\d[\d,]+)/,
  ];
  for(const p of ps){const m=t.match(p);if(m){const v=parseInt(m[1].replace(/,/g,''));if(v>0)return v;}}
  return null;
}
function parseTaxId(t){
  const ps=[
    // 1. 精確關鍵字（繁體+簡體）
    /(?:買方統編|買方統一編號|買受人統編|買受人統一編號|买方统编|买方统一编号)[:\s：\u3000]*(\d{8})/,
    // 2. 台灣電子發票：「賣方 XXXXXXXX 買方 YYYYYYYY」，允許字間有空格
    /(?:賣[\s]?方|卖[\s]?方)[:\s\u3000]*\d{8}[^\d\n\r]{1,12}(?:買[\s]?方|买[\s]?方)[:\s\u3000]*(\d{8})/,
    // 3. 一般買方，允許字間空格
    /(?:買[\s]?方|买[\s]?方)[:\s：\u3000]{0,8}(\d{8})/,
    /(?:買受人|买受人)[:\s：\u3000]{0,6}(\d{8})/,
    // 4. 統一編號
    /統[\s]?一[\s]?編[\s]?號[:\s：\u3000]*(\d{8})/,
    /统[\s]?一[\s]?编[\s]?号[:\s：\u3000]*(\d{8})/,
    // 5. 終極備援：全文中兩個相鄰 7-8 位數字，取第二個（OCR 可能漏讀一位）
    /\d{7,8}[^\d\n\r]{1,12}(\d{7,8})/,
  ];
  for(const p of ps){const m=t.match(p);if(m)return m[m.length-1];}
  return null;
}
function parseInvoiceNo(t){
  // 台灣統一發票號碼：2個英文字母 + 8位數字，如 AB-12345678 或 AB12345678
  let m=t.match(/[A-Za-z]{2}[-\s]?\d{8}/);
  if(m){
    const raw=m[0].replace(/\s/g,'').toUpperCase();
    // 格式化為 XX-XXXXXXXX
    return raw.slice(0,2)+'-'+raw.replace(/[^0-9]/g,'');
  }
  return null;
}
function resetScan(){
  document.getElementById('scanEmpty').style.display='block';
  document.getElementById('scanActive').style.display='none';
  document.getElementById('cameraWrap').style.display='none';
  document.getElementById('scanInput').value='';
  stopCamera();
}

// ── 即時相機（getUserMedia 真正即時鏡頭）──
let cameraStream=null;

async function startCamera(){
  const wrap=document.getElementById('cameraWrap');
  const video=document.getElementById('cameraVideo');
  const label=document.getElementById('cameraLabel');
  const desc=document.getElementById('cameraDesc');

  // 先更新按鈕文字提示開啟中
  label.textContent='開啟中...';
  desc.textContent='請允許相機存取';

  try{
    // 優先用後鏡頭（手機），電腦則用預設鏡頭
    let stream;
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}}
      });
    }catch(e){
      // 後鏡頭失敗，改試任何可用鏡頭
      stream=await navigator.mediaDevices.getUserMedia({video:true});
    }
    cameraStream=stream;
    video.srcObject=stream;
    // 確認有畫面後才切換 UI
    await new Promise(res=>{video.onloadedmetadata=()=>{video.play();res();};});
    document.getElementById('scanEmpty').style.display='none';
    wrap.style.display='block';
  }catch(err){
    // 完全無法開啟（使用者拒絕或不支援）— 只顯示提示，不跳出選檔視窗
    label.textContent='即時鏡頭掃描';
    desc.textContent='開啟相機對準發票';
    const msg=err.name==='NotAllowedError'?'請允許瀏覽器使用相機權限後再試':
              err.name==='NotFoundError'?'找不到相機裝置':
              '無法開啟相機（'+err.message+')';
    if(window.showToast) window.showToast('⚠️ '+msg+'\n可改用「選擇照片」上傳',true);
    else alert('⚠️ '+msg+'\n可改用「選擇照片」上傳');
  }
}
function stopCamera(){
  if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}
  document.getElementById('cameraWrap').style.display='none';
}
async function captureCamera(){
  const video=document.getElementById('cameraVideo');
  const canvas=document.getElementById('cameraCanvas');
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  stopCamera();
  const dataUrl=canvas.toDataURL('image/jpeg',0.96);
  canvas.toBlob(async blob=>{
    document.getElementById('scanEmpty').style.display='none';
    document.getElementById('scanActive').style.display='block';
    document.getElementById('scanImg').src=dataUrl;
    await runOCR(blob);
    // 掃描完成後自動存入照片清單（稽核用）
    if(window.addScanPhotoToList) window.addScanPhotoToList(dataUrl);
  },'image/jpeg',0.96);
}
// ── 影像預處理：灰階 + 對比增強 + 放大，提升 OCR 準確度 ──
function preprocessForOCR(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        // 放大到至少 2000px 寬（Tesseract 對小圖辨識差）
        const targetW=Math.max(img.width,2000);
        const scale=targetW/img.width;
        const cw=Math.round(img.width*scale),ch=Math.round(img.height*scale);
        const c=document.createElement('canvas');
        c.width=cw;c.height=ch;
        const ctx=c.getContext('2d');
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality='high';
        ctx.drawImage(img,0,0,cw,ch);
        const id=ctx.getImageData(0,0,cw,ch);
        const d=id.data;
        // 轉灰階
        for(let i=0;i<d.length;i+=4){
          const g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
          d[i]=d[i+1]=d[i+2]=g;
        }
        // S 曲線對比增強（保留粗體大字細節，同時提亮小字）
        let mn=255,mx=0;
        for(let i=0;i<d.length;i+=4){if(d[i]<mn)mn=d[i];if(d[i]>mx)mx=d[i];}
        const rng=mx-mn||1;
        for(let i=0;i<d.length;i+=4){
          const n=(d[i]-mn)/rng;                          // 正規化 0~1
          const s=1/(1+Math.exp(-10*(n-0.5)));            // Sigmoid S 曲線
          d[i]=d[i+1]=d[i+2]=Math.round(s*255);
        }
        ctx.putImageData(id,0,0);
        c.toBlob(resolve,'image/png');// PNG 無損格式給 OCR
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function runOCR(file){
  const prog=document.getElementById('scanProgress');
  const fill=document.getElementById('scanFill');
  const txt=document.getElementById('scanTxt');
  const box=document.getElementById('scanResultBox');
  prog.style.display='block';box.style.display='none';fill.style.width='0%';
  try{
    txt.textContent='影像前處理中...';
    const processed=await preprocessForOCR(file);
    const {data:{text}}=await Tesseract.recognize(processed,'chi_tra+eng',{
      logger:m=>{
        if(m.status==='recognizing text'){fill.style.width=(m.progress*100)+'%';txt.textContent=`辨識中 ${Math.round(m.progress*100)}%`;}
        else if(m.status.includes('language')){txt.textContent='載入中文辨識模型（首次需約25MB下載）...';}
        else{txt.textContent=m.status||'處理中...';}
      }
    });
    const d=parseROCDate(text),a=parseAmount(text),tid=parseTaxId(text),inv=parseInvoiceNo(text);
    const rows=[];
    if(d){document.getElementById('date').value=d;rows.push(`✅ 發票日期：${d}`);}
    else rows.push('❓ 發票日期：未找到，請手動填寫');
    if(a){document.getElementById('amount').value=a;rows.push(`✅ 金額：NT$ ${a.toLocaleString()}`);}
    else rows.push('❓ 金額：未找到，請手動填寫');
    if(tid){document.getElementById('taxId').value=tid;rows.push(`✅ 買方統編：${tid}`);}
    else rows.push('❓ 買方統編：未找到，請手動填寫');
    if(inv){document.getElementById('invoiceNo').value=inv;rows.push(`✅ 發票號碼：${inv}`);}
    else rows.push('❓ 發票號碼：未找到，請手動填寫');
    // 顯示結果 + OCR 原始文字（可展開）
    const rawPreview=text.replace(/</g,'&lt;').replace(/\n/g,'↵ ').slice(0,800);
    box.innerHTML=rows.map(r=>`<div class="scan-result-row">${r}</div>`).join('')+
      `<details style="margin-top:8px"><summary style="font-size:11px;color:#aaa;cursor:pointer">🔍 OCR 原始文字（除錯用）</summary><pre style="font-size:10px;color:#888;white-space:pre-wrap;max-height:120px;overflow-y:auto;background:#f0f0f0;padding:6px;border-radius:6px;margin-top:4px">${rawPreview}...</pre></details>`;
    prog.style.display='none';box.style.display='block';
  }catch(err){
    box.innerHTML='<div style="color:#e74c3c;font-size:13px">⚠️ 辨識失敗，請手動填寫</div>';
    prog.style.display='none';box.style.display='block';
  }
}

// 共用：選圖/手機拍照 → 預覽 + OCR + 存入稽核清單
async function handleScanFile(file){
  if(!file)return;
  document.getElementById('scanEmpty').style.display='none';
  document.getElementById('scanActive').style.display='block';
  const reader=new FileReader();
  reader.onload=ev=>{
    document.getElementById('scanImg').src=ev.target.result;
    if(window.addScanPhotoToList) window.addScanPhotoToList(ev.target.result);
  };
  reader.readAsDataURL(file);
  await runOCR(file);
}
document.getElementById('scanInput').addEventListener('change',async e=>{
  await handleScanFile(e.target.files[0]);e.target.value='';
});
</script>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,collection,addDoc,onSnapshot,orderBy,query,serverTimestamp}
  from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app=initializeApp({apiKey:"AIzaSyBKBZ8RDjqyZtCJA-B0oL2RaWlLI73dZQg",authDomain:"luxus-paint.firebaseapp.com",projectId:"luxus-paint",storageBucket:"luxus-paint.firebasestorage.app",messagingSenderId:"522125845472",appId:"1:522125845472:web:de306efe026c3f0eee4185"});
const db=getFirestore(app);

// 日期預設
const today=new Date().toISOString().split('T')[0];
document.getElementById('applicationDate').value=today;
document.getElementById('date').value=today;

// 照片壓縮
const MAX_W=1000,QUAL=0.65,MAX_P=5;// 壓縮規格：Firestore 文件上限 1MB，5 張需各控制在 ~150KB
let photos=[];
const ua=document.getElementById('uploadArea'),fi=document.getElementById('fileInput'),pg=document.getElementById('previewGrid');
ua.addEventListener('click',()=>fi.click());
fi.addEventListener('change',e=>addFiles(e.target.files));
ua.addEventListener('dragover',e=>{e.preventDefault();ua.classList.add('drag-over')});
ua.addEventListener('dragleave',()=>ua.classList.remove('drag-over'));
ua.addEventListener('drop',e=>{e.preventDefault();ua.classList.remove('drag-over');addFiles(e.dataTransfer.files)});
async function addFiles(fs){
  for(const f of fs){
    if(!f.type.startsWith('image/'))continue;
    if(photos.filter(Boolean).length>=MAX_P){showToast('最多 5 張',true);break;}
    const url=await compress(f);photos.push(url);addPreview(url,photos.length-1);
  }
  updPCnt();fi.value='';
}
function compress(file){return new Promise(r=>{const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>MAX_W){h=Math.round(h*MAX_W/w);w=MAX_W;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);r(c.toDataURL('image/jpeg',QUAL));};img.src=e.target.result;};rd.readAsDataURL(file);})}
function addPreview(url,idx,label=''){
  const d=document.createElement('div');d.className='pi';d.dataset.idx=idx;
  d.innerHTML=`<img src="${url}">${label?`<div style="position:absolute;bottom:0;left:0;right:0;background:rgba(233,69,96,.85);color:#fff;font-size:10px;font-weight:700;padding:2px 4px;text-align:center">${label}</div>`:''}<button class="pi-del" data-idx="${idx}">✕</button>`;
  pg.appendChild(d);
}
pg.addEventListener('click',e=>{if(e.target.classList.contains('pi-del')){const i=+e.target.dataset.idx;photos[i]=null;e.target.closest('.pi').remove();updPCnt();}});
function updPCnt(){const n=photos.filter(Boolean).length;document.getElementById('pcnt').textContent=n?`已選 ${n} 張（含掃描照片，已壓縮）`:'';}

// 供 OCR script 呼叫：將掃描照片壓縮後加入送出清單
window.addScanPhotoToList=function(dataUrl){
  if(photos.filter(Boolean).length>=MAX_P){showToast('照片已達上限 5 張',true);return;}
  // ★ 掃描照片也必須壓縮，否則 4K 原圖超過 Firestore 1MB 限制
  const img=new Image();
  img.onload=function(){
    let w=img.width,h=img.height;
    if(w>MAX_W){h=Math.round(h*MAX_W/w);w=MAX_W;}
    const c=document.createElement('canvas');
    c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    const compressed=c.toDataURL('image/jpeg',QUAL);
    photos.push(compressed);
    addPreview(compressed,photos.length-1,'📷 掃描');
    updPCnt();
    document.getElementById('previewGrid').scrollIntoView({behavior:'smooth',block:'nearest'});
    showToast('📷 掃描照片已存入，將隨請款單一起上傳');
  };
  img.src=dataUrl;
};

// 送出
document.getElementById('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='⏳ 儲存中...';
  const bar=document.getElementById('submitBar'),fill=document.getElementById('submitFill');
  bar.style.display='block';fill.style.width='50%';
  try{
    await addDoc(collection(db,'invoices'),{
      applicationDate:document.getElementById('applicationDate').value,
      date:document.getElementById('date').value,
      amount:Number(document.getElementById('amount').value),
      taxId:document.getElementById('taxId').value.trim(),
      invoiceNo:document.getElementById('invoiceNo').value.trim(),
      applicant:document.getElementById('applicant').value.trim(),
      email:document.getElementById('email').value.trim(),
      purpose:document.getElementById('purpose').value.trim(),
      photos:photos.filter(Boolean),
      status:'pending',
      createdAt:serverTimestamp()
    });
    fill.style.width='100%';
    setTimeout(()=>{bar.style.display='none';fill.style.width='0%';},600);
    showToast('✅ 請款單送出！等待會計審查');
    e.target.reset();
    const t=new Date().toISOString().split('T')[0];
    document.getElementById('applicationDate').value=t;
    document.getElementById('date').value=t;
    photos=[];pg.innerHTML='';document.getElementById('pcnt').textContent='';
    resetScan();
  }catch(err){showToast('❌ 失敗：'+err.message,true);bar.style.display='none';}
  btn.disabled=false;btn.textContent='📤 送出請款單';
});

// 篩選
let all=[];
function getF(){
  const s=document.getElementById('fStart').value,en=document.getElementById('fEnd').value,
    nm=document.getElementById('fName').value.trim().toLowerCase(),
    st=document.getElementById('fStatus').value;
  return all.filter(d=>{
    if(s&&d.applicationDate<s)return false;
    if(en&&d.applicationDate>en)return false;
    if(nm&&!(d.applicant||'').toLowerCase().includes(nm))return false;
    if(st&&d.status!==st)return false;
    return true;
  });
}
['fStart','fEnd','fName','fStatus'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{const f=getF();render(f);stats(f);}));
document.getElementById('btnCl').addEventListener('click',()=>{'fStart,fEnd,fName'.split(',').forEach(id=>document.getElementById(id).value='');document.getElementById('fStatus').value='';const f=getF();render(f);stats(f);});

// 下載
document.getElementById('btnDl').addEventListener('click',()=>{
  const rows=getF();if(!rows.length){showToast('沒有資料',true);return;}
  const header=['申請日期','發票日期','金額(元)','統編','發票號碼','申請人','電子信箱','用途','狀態','退件原因','照片數'];
  const body=rows.map(d=>[d.applicationDate||'',d.date||'',d.amount||0,d.taxId||'',`"${(d.invoiceNo||'')}"`,'\"'+(d.applicant||'')+'\"','\"'+(d.email||'')+'\"','\"'+(d.purpose||'').replace(/\n/g,' ').replace(/"/g,'""')+'\"',statusLabel(d.status),`"${(d.rejectionReason||'').replace(/"/g,'""')}"`, (d.photos||[]).length]);
  const csv='\uFEFF'+[header,...body].map(r=>r.join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`LUXUS_請款_${document.getElementById('fStart').value||'all'}_${document.getElementById('fEnd').value||'all'}.csv`;
  a.click();showToast(`✅ 下載 ${rows.length} 筆`);
});

// 即時監聽
const q=query(collection(db,'invoices'),orderBy('createdAt','desc'));
onSnapshot(q,snap=>{all=snap.docs.map(d=>({id:d.id,...d.data()}));const f=getF();render(f);stats(f);});

function statusBadge(s){
  const map={pending:'<span class="badge b-pending">🕐 審查中</span>',approved:'<span class="badge b-approved">✅ 通過</span>',rejected:'<span class="badge b-rejected">❌ 退件</span>',paid:'<span class="badge b-paid">💰 已付款</span>'};
  return map[s]||'';
}
function statusLabel(s){return{pending:'審查中',approved:'通過',rejected:'退件',paid:'已付款'}[s]||s;}

function render(docs){
  const list=document.getElementById('recList');
  document.getElementById('rcnt').textContent=`共 ${docs.length} 筆`;
  if(!docs.length){list.innerHTML='<div class="empty"><div class="ei">🧾</div>尚無符合紀錄</div>';return;}
  list.innerHTML=docs.map(d=>{
    const photos=(d.photos||[]).map((u,i)=>`<img class="ri-photo" src="${u}" data-photos='${JSON.stringify(d.photos)}' data-index="${i}">`).join('');
    const reject=d.status==='rejected'&&d.rejectionReason?`<div class="ri-reject">📋 退件原因：${d.rejectionReason}</div>`:'';
    return `<div class="ri">
      <div class="ri-top">
        <div><div class="ri-no">🧾 ${d.invoiceNo||'—'}</div><div class="ri-amount">NT$ ${(d.amount||0).toLocaleString()} <small>元</small></div></div>
        <div style="text-align:right">${statusBadge(d.status)}<br><span style="font-size:11px;color:#aaa">${d.applicationDate||''}</span></div>
      </div>
      <div class="ri-meta"><span>👤 ${d.applicant||'—'}</span><span>📧 ${d.email||'—'}</span><span>📅 發票日 ${d.date||'—'}</span>${d.taxId?`<span>統編 ${d.taxId}</span>`:''}</div>
      <div class="ri-purpose">📝 ${d.purpose||'—'}</div>
      ${reject}
      ${photos?`<div class="ri-photos">${photos}</div>`:''}
    </div>`;
  }).join('');
  list.querySelectorAll('.ri-photo').forEach(img=>img.addEventListener('click',()=>openLB(JSON.parse(img.dataset.photos),+img.dataset.index)));
}

function stats(docs){
  const now=new Date(),y=now.getFullYear(),m=String(now.getMonth()+1).padStart(2,'0'),ym=`${y}-${m}`;
  const mo=docs.filter(d=>(d.applicationDate||'').startsWith(ym));
  document.getElementById('sCount').textContent=mo.length;
  document.getElementById('sAmount').textContent='NT$'+mo.reduce((s,d)=>s+(d.amount||0),0).toLocaleString();
  document.getElementById('sPending').textContent=all.filter(d=>d.status==='pending').length;
  document.getElementById('sApproved').textContent=mo.filter(d=>d.status==='approved'||d.status==='paid').length;
}

// Lightbox
let lbP=[],lbI=0;
const lbEl=document.getElementById('lb'),lbImg=document.getElementById('lbImg');
function openLB(p,i){lbP=p;lbI=i;lbImg.src=lbP[lbI];lbEl.classList.add('open');}
document.getElementById('lbX').onclick=()=>lbEl.classList.remove('open');
document.getElementById('lbP').onclick=()=>{lbI=(lbI-1+lbP.length)%lbP.length;lbImg.src=lbP[lbI];};
document.getElementById('lbN').onclick=()=>{lbI=(lbI+1)%lbP.length;lbImg.src=lbP[lbI];};
lbEl.addEventListener('click',e=>{if(e.target===lbEl)lbEl.classList.remove('open');});

function showToast(msg,isErr=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(isErr?' err':'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}
window.showToast=showToast;
</script>
</body>
